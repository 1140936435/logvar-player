<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>慢播 - 日志</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    body {
      background: #0d0d0d;
      color: #e0e0e0;
      font-family: 'Consolas', 'Courier New', monospace;
      font-size: 13px;
      line-height: 1.5;
      overflow: hidden;
      height: 100vh;
      display: flex;
      flex-direction: column;
    }
    .toolbar {
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 6px 12px;
      background: #1a1a1a;
      border-bottom: 1px solid #2a2a2a;
      flex-shrink: 0;
    }
    .toolbar h3 {
      font-size: 13px;
      font-weight: 600;
      color: #a78bfa;
    }
    .toolbar-actions {
      display: flex;
      gap: 8px;
    }
    .toolbar button {
      padding: 3px 12px;
      border: 1px solid #333;
      background: #222;
      color: #ccc;
      border-radius: 4px;
      cursor: pointer;
      font-size: 12px;
    }
    .toolbar button:hover { background: #333; }
    .toolbar button.active { background: #7c3aed; border-color: #7c3aed; color: #fff; }
    .log-container {
      flex: 1;
      overflow-y: auto;
      padding: 8px 12px;
    }
    .log-entry {
      padding: 2px 0;
      border-bottom: 1px solid #1a1a1a;
      white-space: pre-wrap;
      word-break: break-all;
    }
    .log-entry .timestamp { color: #666; margin-right: 8px; }
    .log-entry .level { display: inline-block; width: 40px; font-weight: bold; }
    .log-entry .level.info { color: #60a5fa; }
    .log-entry .level.warn { color: #fbbf24; }
    .log-entry .level.error { color: #f87171; }
    .log-entry .level.debug { color: #a78bfa; }
    .log-entry .source { color: #555; margin-right: 6px; }
    .log-entry .message { color: #d4d4d4; }
    .empty-state {
      display: flex;
      align-items: center;
      justify-content: center;
      height: 100%;
      color: #444;
      font-size: 14px;
    }
    ::-webkit-scrollbar { width: 6px; }
    ::-webkit-scrollbar-track { background: transparent; }
    ::-webkit-scrollbar-thumb { background: #333; border-radius: 3px; }
  </style>
</head>
<body>
  <div class="toolbar">
    <h3>慢播 日志</h3>
    <div class="toolbar-actions">
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:#888;cursor:pointer;">
        <input type="checkbox" id="filterInfo" checked /> Info
      </label>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:#888;cursor:pointer;">
        <input type="checkbox" id="filterWarn" checked /> Warn
      </label>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:#888;cursor:pointer;">
        <input type="checkbox" id="filterError" checked /> Error
      </label>
      <label style="display:flex;align-items:center;gap:4px;font-size:12px;color:#888;cursor:pointer;">
        <input type="checkbox" id="filterDebug" checked /> Debug
      </label>
      <button id="btnClear">清空</button>
      <button id="btnAutoScroll" class="active">自动滚动</button>
    </div>
  </div>
  <div class="log-container" id="logContainer">
    <div class="empty-state">等待日志输出...</div>
  </div>
  <script>
    const { ipcRenderer } = require('electron');
    const logContainer = document.getElementById('logContainer');
    const emptyState = logContainer.querySelector('.empty-state');
    let autoScroll = true;
    let logEntries = [];
    const filters = { info: true, warn: true, error: true, debug: true };

    document.getElementById('btnClear').addEventListener('click', () => {
      logEntries = [];
      logContainer.innerHTML = '<div class="empty-state">日志已清空</div>';
    });

    document.getElementById('btnAutoScroll').addEventListener('click', function() {
      autoScroll = !autoScroll;
      this.classList.toggle('active', autoScroll);
      this.textContent = autoScroll ? '自动滚动' : '手动滚动';
    });

    ['Info', 'Warn', 'Error', 'Debug'].forEach(level => {
      document.getElementById('filter' + level).addEventListener('change', function() {
        filters[level.toLowerCase()] = this.checked;
        renderLogs();
      });
    });

    function formatTime(ts) {
      const d = new Date(ts);
      return d.toLocaleTimeString('zh-CN', { hour12: false }) + '.' + String(d.getMilliseconds()).padStart(3, '0');
    }

    function createLogEntry(entry) {
      const div = document.createElement('div');
      div.className = 'log-entry';
      div.dataset.level = entry.level;
      div.innerHTML =
        `<span class="timestamp">${formatTime(entry.timestamp)}</span>` +
        `<span class="level ${entry.level}">${entry.level.toUpperCase()}</span>` +
        `<span class="source">[${entry.source}]</span>` +
        `<span class="message">${escapeHtml(entry.message)}</span>`;
      return div;
    }

    function escapeHtml(text) {
      const div = document.createElement('div');
      div.textContent = text;
      return div.innerHTML;
    }

    function renderLogs() {
      logContainer.innerHTML = '';
      const filtered = logEntries.filter(e => filters[e.level]);
      if (filtered.length === 0) {
        logContainer.innerHTML = '<div class="empty-state">无匹配日志</div>';
        return;
      }
      filtered.forEach(entry => {
        logContainer.appendChild(createLogEntry(entry));
      });
      if (autoScroll) {
        logContainer.scrollTop = logContainer.scrollHeight;
      }
    }

    ipcRenderer.on('log:entry', (_event, entry) => {
      logEntries.push(entry);
      // 最多保留 5000 条
      if (logEntries.length > 5000) logEntries.shift();
      if (filters[entry.level]) {
        logContainer.appendChild(createLogEntry(entry));
        if (autoScroll) {
          logContainer.scrollTop = logContainer.scrollHeight;
        }
      }
      if (emptyState) emptyState.remove();
    });

    // 加载已有日志
    ipcRenderer.on('log:history', (_event, entries) => {
      logEntries = entries;
      renderLogs();
    });
  </script>
</body>
</html>
