name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  verify:
    # Windows + Electron + native DLL + Koffi 组合，typecheck/test/build 必须在 Windows runner 上验证
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Test
        run: npm test

      - name: Build
        run: npm run build
