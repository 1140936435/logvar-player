appId: com.huanying.player
productName: 环影
directories:
  buildResources: build
  output: dist
files:
  - "!**/.vscode/*"
  - "!src/**"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!{.gitignore,*.py,*.txt,*.cmd,*.bat,*.sh}"
  - "!tools/**"
  - "!docs/**"
  - "!temp/**"
  - "!mpv/**"
  - "!resources/**"
  - "!logvar-player/**"
  - "!.qoder/**"
  - "!dist*/**"
  - "!assets/icon/**"
  - "!scripts/**"
  # M9: 打包卫生 —— 防止开发环境杂项被打进 asar
  - "!.venv/**"
  - "!.workbuddy/**"
  - "!.eb-cache/**"
  - "!.backup_*"
  - "!.trae-cn/**"
  - "!deliverables/**"
  - "!*.log"
  - "!*.md"
  - "!*[0-9]"
asarUnpack:
  - out/tools/**
extraResources:
  - from: build
    to: icon
    filter:
      - "icon-256.png"
      - "icon-32.png"
      - "icon-512.png"
      - "icon-128.png"
      - "icon-64.png"
      - "icon-16.png"
      - "icon.png"
      - "icon.ico"
  # mpv 播放引擎运行时（主进程 spawn resources/mpv/mpv.exe）
  - from: resources/mpv
    to: mpv
    filter:
      - "mpv.exe"
      - "d3dcompiler_43.dll"
  # libmpv 画布渲染引擎（方案 C：preload 经 koffi 加载 libmpv-2.dll）
  - from: mpv
    to: mpv
    filter:
      - "libmpv-2.dll"
win:
  executableName: 环影
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  include: scripts/installer.nsh
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
