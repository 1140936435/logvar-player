appId: com.mplay.player
productName: mplay
directories:
  buildResources: build
  output: dist3
files:
  - "!**/.vscode/*"
  - "!src/**"
  - "!electron.vite.config.*"
  - "!{.eslintignore,.eslintrc.cjs,.prettierignore,.prettierrc.yaml,dev-app-update.yml,CHANGELOG.md,README.md}"
  - "!{tsconfig.json,tsconfig.node.json,tsconfig.web.json}"
  - "!{.gitignore,*.py,*.txt,*.cmd,*.bat,*.sh}"
  - "!tools/**"
  - "!docs/**"
  - "!temp/**"
  - "!mpv/**"
  - "!resources/**"
  - "!logvar-player/**"
  - "!.qoder/**"
  - "!dist*/**"
  - "!assets/icon/icon-512.png"
  - "!assets/icon/icon-128.png"
  - "!assets/icon/icon-64.png"
  - "!assets/icon/icon-16.png"
  - "!scripts/**"
asarUnpack:
  - out/tools/**
# 统一图标资源：将 assets/icon 整目录复制到打包后的 resources/icon
# 主进程通过 getIconPath() 从 resources/icon 读取，开发环境从 assets/icon 读取
extraResources:
  - from: assets/icon
    to: icon
    filter:
      - "icon-256.png"
      - "icon-32.png"
  - from: build
    to: build
    filter:
      - "icon*"
win:
  executableName: mplay
  icon: build/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  artifactName: ${productName}-${version}-setup.${ext}
  shortcutName: ${productName}
  uninstallDisplayName: ${productName}
  createDesktopShortcut: always
  oneClick: false
  allowToChangeInstallationDirectory: true
  installerIcon: build/icon.ico
  uninstallerIcon: build/icon.ico
  installerHeaderIcon: build/icon.ico
