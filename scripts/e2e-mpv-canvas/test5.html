<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>mpv canvas e2e v5 - direct jellyfin stream</title></head>
<body style="margin:0;background:#000">
<canvas id="c" style="position:absolute;left:0;top:0;width:400px;height:280px"></canvas>
<script>
// v5: 直接构造 Jellyfin 静态流地址（与主进程 get-playback-url 同构），
// 测试 libmpv 在渲染进程内播放【网络流】+ 事件链路
const log = (m) => console.log('[e2e] ' + m)
const sleep = (ms) => new Promise(r => setTimeout(r, ms))

// 由 main.cjs 经 query 注入
const params = new URLSearchParams(location.search)
const BASE = params.get('base') || ''
const TOKEN = params.get('token') || ''
const ITEM_ID = params.get('item') || '74416c9a2f1a4c1cd1deb70cd844c600'

async function main() {
  log('=== v5: Jellyfin 网络流 ===')
  if (!BASE || !TOKEN) { log('缺少 base/token 参数'); console.log('E2E_DONE'); return }
  const url = `${BASE}/Videos/${ITEM_ID}/stream?Static=true&api_key=${TOKEN}`
  log('播放地址: ' + url.replace(TOKEN, '***'))

  // 先用 fetch 探测 URL 可达性（排除服务器不在线等环境因素）
  try {
    const probe = await fetch(url, { headers: { Range: 'bytes=0-1023' } })
    log('URL 探测: HTTP ' + probe.status + ' content-type=' + (probe.headers.get('content-type') || '?'))
  } catch (e) {
    log('URL 探测失败(不影响 mpv 测试,仅供参考): ' + e.message)
  }

  window.api.mpvRender.onEvent((event, data) => {
    log(`[event] ${event}` + (data !== undefined ? ` data=${String(data).slice(0, 200)}` : ''))
  })

  window.api.mpvRender.setTargetSize(400, 280)
  const playRes = await window.api.mpvRender.play(url, { hardwareDecode: true })
  log('play=' + JSON.stringify(playRes))
  if (!playRes.success) { console.log('E2E_DONE'); return }

  let firstFrame = null
  let lastSeq = -1
  let updates = 0
  const t0 = Date.now()
  while (Date.now() - t0 < 20000) {
    try {
      const f = await window.api.mpvRender.getFrame(lastSeq)
      if (f && f.seq !== lastSeq) {
        if (!firstFrame) {
          firstFrame = f
          log(`首帧到达 耗时=${Date.now() - t0}ms seq=${f.seq} w=${f.width} h=${f.height}`)
        }
        lastSeq = f.seq
        updates++
      }
    } catch (e) { log('getFrame 异常: ' + (e && e.message)); break }
    await sleep(120)
  }

  if (!firstFrame) {
    log('★ 20s 内没有任何帧（seq 未推进）→ 复现真实应用黑屏！')
  } else {
    const px = firstFrame.buffer instanceof Uint8Array ? firstFrame.buffer : new Uint8Array(firstFrame.buffer)
    let nonZero = 0
    for (let i = 0; i < px.length; i += 997) if (px[i] !== 0 || px[i + 2] !== 0) nonZero++
    log(`首帧抽样非零=${nonZero} 20s内更新${updates}次` + (nonZero === 0 ? ' ★ 帧全黑！' : '（帧数据正常）'))
  }
  await window.api.mpvRender.stop().catch(() => {})
  await window.api.mpvRender.destroy().catch(() => {})
  window.api.mpvRender.offEvent()
  console.log('E2E_DONE')
}
main().catch(e => { console.log('[e2e] 未捕获异常: ' + e.message); console.log('E2E_DONE') })
</script>
</body>
</html>
