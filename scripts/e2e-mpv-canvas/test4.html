<!DOCTYPE html>
<html>
<head><meta charset="utf-8"><title>mpv canvas e2e v4 - real jellyfin url</title></head>
<body style="margin:0;background:#000">
<canvas id="c" style="position:absolute;left:0;top:0;width:400px;height:280px"></canvas>
<script>
// v4: 真实 Jellyfin 播放地址（与正式应用完全同源同 URL），完整事件监听
const log = (m) => console.log('[e2e] ' + m)
const sleep = (ms) => new Promise(r => setTimeout(r, ms))
const ITEM_ID = '74416c9a2f1a4c1cd1deb70cd844c600' // 用户日志中《田耕纪》S1E1

async function main() {
  log('=== v4: 真实 Jellyfin 流 ===')
  const jf = await window.api.store.get('jellyfin').catch(() => null)
  log('jellyfin 配置存在: ' + !!jf + (jf && jf.baseUrl ? ' baseUrl=' + jf.baseUrl : ''))
  const urlRes = await window.api.jellyfin.getPlaybackUrl(ITEM_ID).catch(e => ({ success: false, error: String(e) }))
  if (!urlRes.success || !urlRes.data || !urlRes.data.url) {
    log('getPlaybackUrl 失败: ' + JSON.stringify(urlRes).slice(0, 300))
    console.log('E2E_DONE'); return
  }
  const url = urlRes.data.url
  log('播放地址: ' + url.slice(0, 120) + (url.length > 120 ? '...' : ''))

  // 监听全部 mpv 渲染引擎事件（file-loaded / start / error / stop / quit）
  window.api.mpvRender.onEvent((event, data) => {
    log(`[event] ${event}` + (data !== undefined ? ` data=${String(data).slice(0, 200)}` : ''))
  })

  window.api.mpvRender.setTargetSize(400, 280)
  const playRes = await window.api.mpvRender.play(url, { hardwareDecode: true })
  log('play=' + JSON.stringify(playRes))
  if (!playRes.success) { console.log('E2E_DONE'); return }

  // 轮询 20s（网络流起播较慢）
  let firstFrame = null
  let lastSeq = -1
  let updates = 0
  const t0 = Date.now()
  while (Date.now() - t0 < 20000) {
    try {
      const f = await window.api.mpvRender.getFrame(lastSeq)
      if (f && f.seq !== lastSeq) {
        if (!firstFrame) {
          firstFrame = f
          log(`首帧到达 耗时=${Date.now() - t0}ms seq=${f.seq} w=${f.width} h=${f.height}`)
        }
        lastSeq = f.seq
        updates++
      }
    } catch (e) { log('getFrame 异常: ' + (e && e.message)); break }
    await sleep(120)
  }

  if (!firstFrame) {
    log('20s 内没有任何帧（seq 未推进）→ 复现真实应用黑屏！')
  } else {
    const px = firstFrame.buffer instanceof Uint8Array ? firstFrame.buffer : new Uint8Array(firstFrame.buffer)
    let nonZero = 0
    for (let i = 0; i < px.length; i += 997) if (px[i] !== 0 || px[i + 2] !== 0) nonZero++
    log(`首帧抽样非零=${nonZero} 20s内更新${updates}次` + (nonZero === 0 ? ' ← 帧全黑！' : '（帧数据正常）'))
  }
  await window.api.mpvRender.stop().catch(() => {})
  await window.api.mpvRender.destroy().catch(() => {})
  window.api.mpvRender.offEvent()
  console.log('E2E_DONE')
}
main().catch(e => { console.log('[e2e] 未捕获异常: ' + e.message); console.log('E2E_DONE') })
</script>
</body>
</html>
